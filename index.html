<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Document Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-hover: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --radius: 10px;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 340px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h1 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        .search-box { padding: 12px 20px; border-bottom: 1px solid var(--border); }
        .search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-body); color: var(--text-main); outline: none; }

        .doc-list { flex: 1; overflow-y: auto; padding: 10px 0; }
        .category-title { padding: 12px 20px 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
        .doc-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-left: 3px solid transparent; transition: 0.15s; }
        .doc-item:hover { background: var(--bg-hover); }
        .doc-item.active { background: var(--bg-hover); border-left-color: var(--primary); }
        .doc-icon { color: var(--primary); width: 20px; text-align: center; font-size: 1.1rem; }

        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-body); }
        .header { padding: 14px 24px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-main); cursor: pointer; text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { border-color: var(--primary); color: var(--primary); }

        .viewer-canvas { flex: 1; padding: 20px; display: flex; }
        .viewer-card { width: 100%; height: 100%; background: var(--bg-surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; }

        .placeholder { text-align: center; color: var(--text-muted); }
        .theme-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 45vh; }
            .viewer-canvas { padding: 10px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1><i class="fas fa-motorcycle text-primary"></i> RIDE Docs</h1>
            <button class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon" id="t-icon"></i></button>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Search RC, DL, Insurance..." onkeyup="filterDocs()">
        </div>
        <div class="doc-list" id="doc-list"></div>
    </aside>

    <main class="main">
        <header class="header">
            <h2 id="doc-title" style="font-size: 1.1rem;">Select a Document</h2>
            <div style="display: flex; gap: 8px;">
                <a href="#" id="open-drive-btn" target="_blank" class="btn" style="display:none;">
                    <i class="fab fa-google-drive"></i> Open in Drive
                </a>
            </div>
        </header>
        <section class="viewer-canvas">
            <div class="viewer-card" id="viewer">
                <div class="placeholder">
                    <i class="fas fa-id-card fa-3x" style="margin-bottom:12px; opacity:0.4;"></i>
                    <p>Select a document from the sidebar to preview.</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const DOCUMENTS_MANIFEST = [
            // Driver License
            {
                id: 'dl-1',
                title: 'Driver License',
                category: 'RIDE - Personal',
                driveUrl: 'https://drive.google.com/file/d/1Ot8xOTzVfb9RUC_rp7vpPVu3YkK-lT6C/view?usp=drivesdk',
                icon: 'fa-id-badge'
            },

            // TVS Apache RTR 160
            {
                id: 'rtr-rc',
                title: 'Registration RC (Apache RTR)',
                category: 'RIDE - TVS Apache RTR 160',
                driveUrl: 'https://drive.google.com/file/d/1MW6PdGRyxNlYlq5w6Xtwcqvf5ONXBPN1/view?usp=drivesdk',
                icon: 'fa-motorcycle'
            },
            {
                id: 'rtr-ins',
                title: 'Insurance (Apache RTR)',
                category: 'RIDE - TVS Apache RTR 160',
                driveUrl: 'https://drive.google.com/file/d/1cUR2bsfh0rOkVby-vI7mSTSHhMh5xeRA/view?usp=drivesdk',
                icon: 'fa-file-shield'
            },
            {
                id: 'rtr-puc',
                title: 'Emission Test (Apache RTR)',
                category: 'RIDE - TVS Apache RTR 160',
                driveUrl: 'https://drive.google.com/file/d/1zlibITeAC1hdJQQw6RzDHkKB2LJO3-rj/view?usp=drivesdk',
                icon: 'fa-smog'
            },

            // Honda Activa 3G
            {
                id: 'activa-rc',
                title: 'Registration RC (Honda Activa)',
                category: 'RIDE - Honda Activa 3G',
                driveUrl: 'https://drive.google.com/file/d/1MrAnuxqsCeEDstR2avHqRVAh_7-VDfFg/view?usp=drivesdk',
                icon: 'fa-car-side'
            },
            {
                id: 'activa-ins',
                title: 'Insurance (Honda Activa)',
                category: 'RIDE - Honda Activa 3G',
                driveUrl: 'https://drive.google.com/file/d/147FgIkQtKzW7fWcqT7zRuLwa65g5cfqR/view?usp=drivesdk',
                icon: 'fa-file-shield'
            },
            {
                id: 'activa-puc',
                title: 'Emission Test (Honda Activa)',
                category: 'RIDE - Honda Activa 3G',
                driveUrl: 'https://drive.google.com/file/d/1QbiBRbF-awVA3L0oDzmQ-1u6K282ccD5/view?usp=drivesdk',
                icon: 'fa-smog'
            }
        ];

        let activeDoc = null;

        function renderList(items) {
            const listEl = document.getElementById('doc-list');
            listEl.innerHTML = '';

            const groups = items.reduce((acc, doc) => {
                acc[doc.category] = acc[doc.category] || [];
                acc[doc.category].push(doc);
                return acc;
            }, {});

            for (const [cat, docs] of Object.entries(groups)) {
                const catEl = document.createElement('div');
                catEl.className = 'category-title';
                catEl.textContent = cat;
                listEl.appendChild(catEl);

                docs.forEach(doc => {
                    const item = document.createElement('div');
                    item.className = `doc-item ${activeDoc && activeDoc.id === doc.id ? 'active' : ''}`;
                    item.onclick = () => selectDoc(doc);
                    item.innerHTML = `
                        <i class="fas ${doc.icon} doc-icon"></i>
                        <div>
                            <div style="font-size:0.9rem; font-weight:500;">${doc.title}</div>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            }
        }

        function selectDoc(doc) {
            activeDoc = doc;
            document.getElementById('doc-title').textContent = doc.title;
            
            const driveBtn = document.getElementById('open-drive-btn');
            driveBtn.href = doc.driveUrl;
            driveBtn.style.display = 'inline-flex';

            let previewUrl = doc.driveUrl;
            if (previewUrl.includes('/view')) {
                previewUrl = previewUrl.replace('/view', '/preview');
            } else if (!previewUrl.includes('/preview')) {
                previewUrl = previewUrl + '/preview';
            }

            document.getElementById('viewer').innerHTML = `<iframe src="${previewUrl}" allow="autoplay"></iframe>`;
            renderList(DOCUMENTS_MANIFEST);
        }

        function filterDocs() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = DOCUMENTS_MANIFEST.filter(d => 
                d.title.toLowerCase().includes(q) || d.category.toLowerCase().includes(q)
            );
            renderList(filtered);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('t-icon').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        renderList(DOCUMENTS_MANIFEST);
    </script>
</body>
</html>
